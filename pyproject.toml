[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "pycode"
version = "0.1.0"
description = "pycode: a terminal coding agent built on LangChain and LangGraph"
license-files = ["licenses/*.txt"]
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.32",
    "httpx>=0.28,<0.29",
    "pyyaml>=6,<7",
    "textual>=8.2.5,<9",
    "jsonschema>=4.26,<5",
    "langchain[mcp]==1.4.7",
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.7.0",
    "fastmcp==4.1.4",
    "langmem==0.0.30",
    "pydantic>=2.7,<3",
    "langchain-deepseek>=1,<2",
    "langchain-openai>=1.7.3,<2",
    "langchain-anthropic>=1.7.7,<2",
]

[project.scripts]
pycode = "pycode.app.cli:main"

[project.optional-dependencies]
eval = ["langfuse==4.17.0", "openevals==0.2.0", "agentevals==0.0.9"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.17,<1", "setuptools==80.9.0", "wheel==0.45.1"]

[tool.setuptools.package-dir]
pycode = "src"

[tool.setuptools.package-data]
pycode = ["**/*.md", "**/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "cache", "work", "results"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [".venv", ".worktrees", "evals/cache", "evals/work", "evals/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["pycode", "evals"]
